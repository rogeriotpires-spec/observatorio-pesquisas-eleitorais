name: Render social preview PNG
on:
  push:
    branches: [main]
    paths:
      - "docs/og-image.svg"
      - ".github/workflows/render-og-preview.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render 1200x630 PNG
        run: |
          if [ -f docs/og-image.png ]; then
            echo "Preview image already exists."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --format=png --width=1200 --height=630 docs/og-image.svg > docs/og-image.png
          file docs/og-image.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/og-image.png
          git commit -m "Create PNG social preview image"
          git push